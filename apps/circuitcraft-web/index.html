<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CircuitCraft</title>
  <link data-trunk rel="rust" data-bin="circuitcraft-web" data-wasm-opt="z" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #101216; }
    #circuitcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #circuitcraft_loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #8c929c; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="circuitcraft_canvas"></canvas>
  <div id="circuitcraft_loading">Loading CircuitCraft&hellip;</div>
</body>
</html>
