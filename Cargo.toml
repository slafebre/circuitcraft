[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/slafebre/circuitcraft"

[workspace.dependencies]
# internal (layers are enforced by `cargo xtask layers`; see xtask/src/layers.rs)
circuitcraft-units = { path = "crates/units" }
circuitcraft-geom = { path = "crates/geom" }
circuitcraft-model = { path = "crates/model" }
circuitcraft-render = { path = "crates/render" }
circuitcraft-io = { path = "crates/io" }
circuitcraft-engine = { path = "crates/engine" }
circuitcraft-ui-egui = { path = "crates/ui-egui" }
circuitcraft-mcp = { path = "crates/mcp" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
clap = { version = "4", features = ["derive"] }

# command parameters: a JSON Schema generated from the type each command reads, and errors that
# name the parameter that is wrong
schemars = "1.2"
serde_path_to_error = "0.1"

# item ids: random v4 UUIDs (ROADMAP.md, decided 2026-11-13). uuid only formats and parses; the
# random bits come from getrandom, which returns an error instead of panicking.
uuid = { version = "1.29", default-features = false, features = ["serde"] }
getrandom = "0.4.3"

# checksums of the corpus designs that `cargo xtask corpus` fetches
sha2 = "0.10"

# geometry: polygon booleans and offsets on i64 coordinates (ROADMAP.md, decided 2026-11-13)
i_overlay = { version = "9.1.0", default-features = false }

# triangles for filled areas with holes, for the board view's GPU meshes; built on i_overlay
i_triangle = { version = "0.51", default-features = false }

# zipped project folders, which the browser build opens and saves (MIT); deflate only
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }
# zip's deflate goes through flate2, which needs a backend chosen: the pure-Rust one, which builds
# for wasm (MIT OR Apache-2.0)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# headless rendering: anti-aliased paths into a pixel buffer, and PNG output (BSD-3-Clause, pure
# Rust, builds for wasm)
tiny-skia = "0.12"

# ui
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.37", default-features = false }
# native file dialogs on the desktop, the browser's file picker on the web (MIT)
rfd = "0.18"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
